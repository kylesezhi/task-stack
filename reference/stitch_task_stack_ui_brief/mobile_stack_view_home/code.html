  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_4px_16px_rgba(68,52,38,0.05)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><button aria-label="Open stacks drawer" class="flex items-center gap-space-xs h-11 px-space-xs -ml-space-xs rounded text-on-surface hover:text-primary transition-colors" type="button"><span class="material-symbols-outlined text-[22px] text-tertiary">layers</span><span class="font-label-md text-label-md tracking-wider text-on-surface">Stacks</span></button><div class="flex flex-col items-center justify-center text-center px-space-xs"><span class="font-headline-md text-headline-md font-medium text-on-surface leading-tight">Work</span><span class="font-label-sm text-label-sm text-tertiary tracking-wide mt-[-2px]">8 notes</span></div><div class="flex items-center gap-space-xs"><a class="flex items-center gap-1 text-tertiary hover:text-on-surface transition-colors py-1 px-space-xs" data-path="archive" href="#"><span class="font-label-md text-label-md">Archive</span><span class="font-label-sm text-label-sm text-tertiary/75 font-normal">(214)</span></a><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full max-w-[680px] mx-auto px-margin-mobile pt-14 pb-28 bg-surface"><link href="https://fonts.googleapis.com" rel="preconnect"/>

<div class="flex items-center gap-space-xs">

</div>
<div class="flex items-center gap-1.5 opacity-80">
<span class="material-symbols-outlined text-[15px] text-secondary">wb_sunny</span>
<span class="font-label-sm text-label-sm tracking-tight text-on-surface-variant">Morning Daylight • 10:42 AM</span>
</div>
</div>
<!-- 2 & 3. The Physical Desk Stack Stage -->
<div class="relative w-full py-space-md flex flex-col items-center justify-center min-h-[360px] overflow-visible">
<!-- Stack Layer 7 (Deepest Base Note: Soft Lavender) -->
<div class="absolute w-[292px] h-[286px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #e2e0f9; transform: rotate(-3deg) translate(3px, 14px); box-shadow: 0 1px 3px rgba(68,52,38,0.05); filter: contrast(0.97);">
</div>
<!-- Stack Layer 6 (Buried Note: Warm Peach) -->
<div class="absolute w-[296px] h-[288px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #fedbc7; transform: rotate(2deg) translate(-5px, 12px); box-shadow: 0 2px 4px rgba(68,52,38,0.06);">
</div>
<!-- Stack Layer 5 (Buried Note: Gentle Rose) -->
<div class="absolute w-[300px] h-[290px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #fcd5ce; transform: rotate(-4deg) translate(6px, 10px); box-shadow: 0 3px 6px rgba(68,52,38,0.06);">
</div>
<!-- Stack Layer 4 (Buried Note: Fresh Mint) -->
<div class="absolute w-[304px] h-[294px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #d4eedb; transform: rotate(5deg) translate(-4px, 8px); box-shadow: 0 4px 8px rgba(68,52,38,0.07);">
</div>
<!-- Stack Layer 3 (Buried Note: Canary Accent) -->
<div class="absolute w-[306px] h-[296px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #fef08a; transform: rotate(-2deg) translate(2px, 6px); box-shadow: 0 4px 10px rgba(68,52,38,0.07);">
</div>
<!-- Stack Layer 2 (Buried Note: Pale Lavender) -->
<div class="absolute w-[308px] h-[298px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #ede9fe; transform: rotate(4.2deg) translate(3px, 4px); box-shadow: 0 6px 12px rgba(68,52,38,0.08);">
</div>
<!-- Stack Layer 1 (Directly Under Top: Soft Mint) -->
<div class="absolute w-[310px] h-[300px] rounded-lg pointer-events-none transition-all duration-300" style="background-color: #dcfce7; transform: rotate(-3.5deg) translate(-2px, 2px); box-shadow: 0 8px 16px rgba(68,52,38,0.09);">
</div>
<!-- Center Stage Active Note (Top Canary Yellow Note) -->
<div class="relative w-[312px] h-[304px] rounded-lg p-space-lg flex flex-col justify-between cursor-grab active:cursor-grabbing transition-transform duration-200" id="activeStickyNote" style="background-color: #fff7b2; transform: rotate(2.8deg); box-shadow: 0 12px 28px rgba(68,52,38,0.12), 0 3px 8px rgba(50,35,20,0.07);">

<div class="absolute top-0 left-0 right-0 h-6 rounded-t-lg pointer-events-none" style="background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.08) 75%, transparent 100%);">
</div>
<!-- Natural Paper Fiber Hairline Texture -->
<div class="absolute inset-0 rounded-lg pointer-events-none opacity-[0.035]" style="background-image: radial-gradient(#26211c 1px, transparent 0); background-size: 4px 4px;">
</div>
<!-- Note Core Body Content -->
<div class="relative z-10 pt-1">
<p class="text-[26px] leading-snug tracking-normal text-[#1c1b18]" style="font-family: 'Caveat', cursive, sans-serif;">
          Review typography &amp; paper shadows before tomorrow's demo
        </p>
</div>
<!-- Bottom Tactile Microcopy -->
<div class="relative z-10 flex items-center justify-between text-tertiary pt-space-xs" style="color: #6e6559;">
<span class="font-label-sm text-label-sm tracking-wider font-semibold opacity-75">01 OF 08</span>
<div class="flex items-center gap-1 opacity-70">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-[#1c1b18]/40"></span>
<span class="font-label-sm text-label-sm italic" style="font-family: 'Caveat', cursive; font-size: 15px;">fresh ink</span>
</div>
</div>
</div>
</div>
<!-- 4. Tactile Action Row Directly Underneath Stack -->
<div class="w-full flex items-center justify-center gap-space-lg mt-space-md mb-space-sm px-space-xs">
<!-- Toss Action -->
<button class="flex items-center gap-1.5 px-space-md py-2.5 rounded-full text-tertiary hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" id="btnToss" type="button">
<span class="material-symbols-outlined text-[20px]">delete_sweep</span>
<span class="font-label-md text-label-md">Toss</span>
</button>
<!-- DONE Stamp Pill Button -->
<button class="group relative flex items-center justify-center px-space-xl py-3.5 rounded-full text-on-primary bg-primary hover:bg-primary-container active:scale-95 transition-all shadow-[0_6px_18px_rgba(174,42,12,0.32)]" id="btnDone" type="button">
<span class="font-label-lg text-label-lg font-semibold tracking-wider uppercase">DONE</span>
<span class="material-symbols-outlined text-[18px] ml-1.5 -mr-1 transition-transform group-hover:translate-x-0.5">check</span>
</button>
<!-- Edit Action -->
<button class="flex items-center gap-1.5 px-space-md py-2.5 rounded-full text-tertiary hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" id="btnEdit" type="button">
<span class="material-symbols-outlined text-[20px]">edit</span>
<span class="font-label-md text-label-md">Edit</span>
</button>
</div>

<span>See all 8 notes</span>
<span class="material-symbols-outlined text-[16px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
<!-- 6. Mobile Thumb Reach Quick-Add Slip -->
<div class="w-full mt-auto pt-space-xs">
<div class="w-full bg-surface-container-low rounded-xl p-space-sm shadow-[0_4px_16px_rgba(68,52,38,0.06)] flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm flex-1 min-w-0 pl-space-xs">
<span class="material-symbols-outlined text-[20px] text-tertiary/70 shrink-0">edit_note</span>
<input class="w-full bg-transparent border-0 outline-none font-body-md text-body-md text-on-surface placeholder:text-tertiary/70 placeholder:italic p-0" id="quickNoteInput" placeholder="Write it down, stick it on top." style="font-family: 'Inter', sans-serif;" type="text"/>
</div>
<!-- Tactile Push Button -->
<button class="shrink-0 flex items-center gap-1 px-space-md py-2 rounded-lg bg-surface-container-highest hover:bg-surface-variant text-on-surface active:scale-95 transition-all shadow-[0_1px_3px_rgba(68,52,38,0.08)]" id="btnPushNote" type="button">
<span class="font-label-md text-label-md font-semibold text-primary">Push</span>
<span class="material-symbols-outlined text-[16px] text-primary">north</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const activeNote = document.getElementById('activeStickyNote');
    const btnDone = document.getElementById('btnDone');
    const btnToss = document.getElementById('btnToss');
    const btnPush = document.getElementById('btnPushNote');
    const input = document.getElementById('quickNoteInput');

    if (!activeNote) return;

    // Tactile DONE stamp peel micro-animation
    if (btnDone) {
      btnDone.addEventListener('click', () => {
        activeNote.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease';
        activeNote.style.transform = 'translateY(-24px) scale(0.96) rotate(-2deg)';
        activeNote.style.opacity = '0.3';
        
        setTimeout(() => {
          activeNote.style.transform = 'rotate(2.8deg)';
          activeNote.style.opacity = '1';
        }, 450);
      });
    }

    // Toss crumple effect
    if (btnToss) {
      btnToss.addEventListener('click', () => {
        activeNote.style.transition = 'transform 0.3s ease-in, opacity 0.25s ease';
        activeNote.style.transform = 'scale(0.85) rotate(8deg) translateY(30px)';
        activeNote.style.opacity = '0.2';

        setTimeout(() => {
          activeNote.style.transform = 'rotate(2.8deg)';
          activeNote.style.opacity = '1';
        }, 350);
      });
    }

    // Gentle push-to-top micro-interaction
    if (btnPush && input) {
      btnPush.addEventListener('click', () => {
        if (!input.value.trim()) {
          input.focus();
          return;
        }
        btnPush.classList.add('scale-95');
        activeNote.style.transition = 'transform 0.25s ease';
        activeNote.style.transform = 'translateY(-8px) rotate(1.2deg)';
        
        setTimeout(() => {
          btnPush.classList.remove('scale-95');
          activeNote.style.transform = 'rotate(2.8deg)';
          input.value = '';
          input.placeholder = 'Placed gently on stack!';
          setTimeout(() => {
            input.placeholder = 'Write it down, stick it on top.';
          }, 2000);
        }, 220);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(68,52,38,0.06)]" data-active-classes="text-primary font-semibold"><div class="h-16 max-w-[680px] mx-auto px-margin-mobile flex items-center justify-around"><a class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] text-tertiary hover:text-on-surface transition-colors" data-path="stack-notes" href="#"><span class="material-symbols-outlined text-[22px]">sticky_note_2</span><span class="font-label-sm text-label-sm tracking-wide mt-0.5">Desk</span></a><a class="flex items-center justify-center w-11 h-11 rounded-full bg-primary text-on-primary shadow-[0_4px_12px_rgba(174,42,12,0.28)] hover:scale-105 active:scale-95 transition-all" data-path="new-note" href="#"><span class="material-symbols-outlined text-[24px]">add</span></a><a class="flex flex-col items-center justify-center min-w-[48px] min-h-[44px] text-tertiary hover:text-on-surface transition-colors" data-path="desk-organizer" href="#"><span class="material-symbols-outlined text-[22px]">dashboard_customize</span><span class="font-label-sm text-label-sm tracking-wide mt-0.5">Sort</span></a></div></nav></body></html>
