# Toolchain for task-stack — mise is the only prerequisite (DECISIONS.md §11).
# `mise install` provisions everything below; no global node/pnpm needed.
#
# node is pinned to an exact 24.x (>= 24.15) release because the server uses
# the built-in node:sqlite module (DatabaseSync), release-candidate since
# 24.15 — see DECISIONS.md §9. Exact pins keep CI and the Docker builder
# (T36) reproducible.
[tools]
node = "24.22.1"
pnpm = "12.15.0"

# Convenience tasks — run with `mise run <task>`. Tasks execute with the
# pinned toolchain above already on PATH, so no shims/activation needed.
[tasks.dev]
description = "Server dev process: Fastify via tsx watch (http://127.0.0.1:3000)"
run = "pnpm --filter server dev"

[tasks.web]
description = "Web dev process: Vite (http://localhost:5173, /api proxied to the server)"
run = "pnpm --filter web dev"

[tasks.lint]
description = "Lint + format check (ESLint + Prettier) across all packages"
run = "pnpm lint"

[tasks.format]
description = "Auto-fix + format all packages"
run = "pnpm format"

[tasks.test]
description = "Unit tests (Vitest) in shared + server"
run = "pnpm -r test"
