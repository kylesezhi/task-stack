<script>
  (function() {
    const card = document.getElementById('top-card');
    const input = document.getElementById('note-input');
    const textEl = document.getElementById('top-note-text');
    const btnDone = document.getElementById('btn-done');
    const btnToss = document.getElementById('btn-toss');
    const btnEdit = document.getElementById('btn-edit');

    const defaultNotes = [
      "Review typography & paper shadows before tomorrow's demo",
      "Draft invoice summary for client approval (studio retainer)",
      "Refill warm brown fountain ink cartridge & clean nib",
      "Sketch tactile interaction patterns for tactile stack layout",
      "Audit high-contrast accessibility tokens for parchment themes",
      "Order heavy cotton linen sheets for desk blotters",
      "Clear archive folders into annual cold storage backup",
      "Breathe. Walk outside for natural midday sunlight"
    ];

    let currentStack = [...defaultNotes];

    function peelCard(isCompleted) {
      if (currentStack.length <= 1) return;
      
      // Tactile peeling motion away from desk
      card.style.transform = isCompleted 
        ? 'translate(120px, -60px) rotate(16deg) scale(0.92)' 
        : 'translate(-120px, 40px) rotate(-18deg) scale(0.92)';
      card.style.opacity = '0';
      card.style.pointerEvents = 'none';

      setTimeout(() => {
        currentStack.shift();
        textEl.textContent = currentStack[0];
        // Snap back to gentle natural resting position
        card.style.transform = 'translate(0px, 0px) rotate(-2.5deg) scale(1)';
        card.style.opacity = '1';
        card.style.pointerEvents = 'auto';
      }, 260);
    }

    window.pushNewNote = function() {
      const val = input.value.trim();
      if (!val) return;

      // Unpeel down animation
      card.style.transform = 'translateY(-30px) rotate(-1deg) scale(1.03)';
      card.style.boxShadow = '0 18px 32px rgba(68, 52, 38, 0.18)';
      
      setTimeout(() => {
        currentStack.unshift(val);
        textEl.textContent = val;
        card.style.transform = 'translate(0px, 0px) rotate(-2.5deg) scale(1)';
        card.style.boxShadow = '0 10px 24px -2px rgba(68, 52, 38, 0.13), 0 4px 8px -1px rgba(50, 35, 20, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.7)';
        input.value = '';
        input.blur();
      }, 180);
    };

    btnDone.addEventListener('click', () => peelCard(true));
    btnToss.addEventListener('click', () => peelCard(false));

    btnEdit.addEventListener('click', () => {
      input.value = textEl.textContent.trim();
      input.focus();
    });

    // Global keyboard listener for desk shortcut '/'
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
        input.select();
      } else if (e.key === 'Escape' && document.activeElement === input) {
        input.blur();
      }
    });

    // Gentle tactile paper lift on note hover
    card.addEventListener('mouseenter', () => {
      card.style.transform = 'rotate(-1.8deg) translateY(-4px) scale(1.012)';
      card.style.boxShadow = '0 16px 30px rgba(68, 52, 38, 0.15), 0 6px 12px rgba(50, 35, 20, 0.09)';
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotate(-2.5deg) translateY(0px) scale(1)';
      card.style.boxShadow = '0 10px 24px -2px rgba(68, 52, 38, 0.13), 0 4px 8px -1px rgba(50, 35, 20, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.7)';
    });
  })();
</script></main><footer class="w-full py-space-lg text-center select-none"><div class="max-w-7xl mx-auto px-margin-mobile lg:px-margin flex items-center justify-center"><span class="font-label-sm text-label-sm text-tertiary tracking-widest uppercase opacity-60">Desk • Natural Light Focus</span></div></footer></body></html>
